<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test Alien School</title>
<style>
  body {
    margin: 0;
    background: #0a0e27;
    color: #e8f4ff;
    font-family: sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  h1 { color: #00e5ff; text-align: center; font-size: 24px; }
  input {
    width: 100%; max-width: 320px;
    padding: 12px; border-radius: 10px;
    border: 2px solid #00e5ff;
    background: rgba(0,0,0,0.4);
    color: #fff; font-size: 16px;
    margin-bottom: 14px;
  }
  button {
    width: 100%; max-width: 320px;
    padding: 16px; border: none; border-radius: 12px;
    background: linear-gradient(135deg, #00e5ff, #0088cc);
    color: #001018; font-size: 16px; font-weight: bold;
    cursor: pointer;
  }
  button:active { transform: scale(0.97); }
  #result {
    margin-top: 20px;
    padding: 16px;
    border: 1px solid #00e5ff;
    border-radius: 12px;
    max-width: 320px;
    width: 100%;
    text-align: center;
    display: none;
  }
</style>
</head>
<body>

<h1>🚀 Escape The Alien School</h1>

<input type="text" id="inputName" placeholder="Tulis namamu...">
<button id="btnStart">🚀 Mulai Misi</button>

<div id="result">
  <p id="resultText">Halo!</p>
</div>

<script>
  // PENTING: seluruh listener dipasang setelah HTML siap
  window.addEventListener('DOMContentLoaded', function () {
    console.log('✅ DOM siap, memasang listener...');

    var btn = document.getElementById('btnStart');
    var input = document.getElementById('inputName');
    var result = document.getElementById('result');
    var resultText = document.getElementById('resultText');

    if (!btn) {
      console.error('❌ Tombol tidak ditemukan!');
      return;
    }

    btn.addEventListener('click', function () {
      console.log('✅ Tombol diklik!');
      var name = input.value.trim() || 'Cadet';
      resultText.textContent = 'Halo, ' + name + '! Selamat datang di sekolah alien. 👽';
      result.style.display = 'block';
      alert('TOMBOL BERFUNGSI! Nama: ' + name);
    });

    console.log('✅ Listener terpasang.');
  });
</script>
</body>
</html>
